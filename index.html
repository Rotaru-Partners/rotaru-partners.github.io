<!DOCTYPE html>
<html lang="ro">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Rotaru &amp; Rotaru | Sediu</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root {
  /* Identitatea din antet: fond alb, bleumarinul siglei, linia roșie ca singur accent. Coloană unică, gândită pentru telefon. */
  --paper: #FFFFFF;
  --surface: #F6F8FB;
  --ink: #042E6F;
  --muted: #5A6372;
  --accent: #E30613;
  --line: #E3E6EC;
  --body: Inter, system-ui, -apple-system, "Segoe UI", sans-serif;
  color-scheme: light;
}
* { box-sizing: border-box; }
html, body { margin: 0; }
body {
  background: var(--paper);
  color: var(--ink);
  font-family: var(--body);
  font-size: 16px;
  line-height: 1.5;
  -webkit-font-smoothing: antialiased;
}
main {
  max-width: 460px;
  margin: 0 auto;
  padding: 48px 20px 40px;
  display: flex;
  flex-direction: column;
  gap: 32px;
}
header {
  display: flex;
  flex-direction: column;
  align-items: center;
  text-align: center;
  gap: 12px;
}
.eyebrow {
  font-size: 11px;
  font-weight: 600;
  letter-spacing: 0.32em;
  text-transform: uppercase;
  color: var(--accent);
}
.logo { display: block; width: 280px; max-width: 100%; height: auto; }
h1 {
  margin: 0;
  font-size: 12px;
  font-weight: 600;
  letter-spacing: 0.22em;
  text-transform: uppercase;
  color: var(--muted);
  text-wrap: balance;
}
.brand { margin: 0; line-height: 0; }

.card {
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: 14px;
  padding: 24px;
  display: flex;
  flex-direction: column;
  gap: 18px;
}
.label {
  font-size: 12px;
  font-weight: 600;
  letter-spacing: 0.14em;
  text-transform: uppercase;
  color: var(--muted);
  margin: 0;
}
.address {
  display: flex;
  gap: 14px;
  align-items: flex-start;
}
.address svg { flex: none; margin-top: 3px; color: var(--ink); }
.address p { margin: 0; }
.address .street { font-size: 18px; font-weight: 500; }
.address .city { color: var(--muted); }

.copy {
  align-self: flex-start;
  display: inline-flex;
  align-items: center;
  gap: 8px;
  min-height: 44px;
  padding: 0 16px;
  border-radius: 10px;
  border: 1px solid var(--line);
  background: var(--paper);
  color: var(--ink);
  font: 500 14px/1 var(--body);
  cursor: pointer;
}
.copy:hover { border-color: var(--ink); }
.copy[data-done="true"] { color: var(--ink); border-color: var(--ink); }

.nav { display: flex; flex-direction: column; gap: 10px; }
.btn {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  min-height: 54px;
  padding: 0 20px;
  border-radius: 12px;
  text-decoration: none;
  font-weight: 500;
  font-size: 16px;
  border: 1px solid var(--line);
  background: var(--surface);
  color: var(--ink);
  transition: border-color .15s ease, background-color .15s ease;
}
.btn:hover { border-color: var(--ink); }
.btn.primary { background: var(--ink); color: #FFFFFF; border-color: var(--ink); }
.btn.primary:hover { background: #0A3F91; }
.btn small { font-size: 13px; font-weight: 400; opacity: 0.75; }
.btn .go { display: inline-flex; align-items: center; gap: 10px; }

a:focus-visible, button:focus-visible {
  outline: 2px solid var(--ink);
  outline-offset: 3px;
}
footer {
  text-align: center;
  font-size: 13px;
  color: var(--muted);
  border-top: 1px solid var(--line);
  padding-top: 20px;
}
@media (prefers-reduced-motion: reduce) { .btn { transition: none; } }
</style>
</head>
<body>
<main>
  <header>
    <h1 class="brand"><img class="logo" src="antet.jpg" width="612" height="190" alt="Rotaru &amp; Rotaru, Business Counselors, Law Offices"></h1>
  </header>

  <section class="card" aria-labelledby="adresa">
    <h2 class="label" id="adresa">Sediul</h2>
    <div class="address">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 21s-7-6.1-7-11.5a7 7 0 0 1 14 0C19 14.9 12 21 12 21z"/><circle cx="12" cy="9.5" r="2.5"/></svg>
      <div>
        <p class="street">Bulevardul Aviatorilor nr. 52, etaj 1</p>
        <p class="city">Sector 1, București</p>
      </div>
    </div>
    <button type="button" class="copy" id="copy-address" data-done="false">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="9" y="9" width="11" height="11" rx="2"/><path d="M5 15V6a2 2 0 0 1 2-2h9"/></svg>
      <span id="copy-label">Copiază adresa</span>
    </button>
  </section>

  <section class="nav" aria-label="Navigare către sediu">
    <h2 class="label">Navigare</h2>
    <a class="btn primary" href="https://www.google.com/maps/search/?api=1&amp;query=Bulevardul%20Aviatorilor%2052%2C%20Sector%201%2C%20Bucure%C8%99ti" target="_blank" rel="noopener">
      <span>Google Maps</span>
      <span class="go"><small>Deschide harta</small><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M7 17 17 7M9 7h8v8"/></svg></span>
    </a>
    <a class="btn" href="https://waze.com/ul?q=Bulevardul%20Aviatorilor%2052%2C%20Bucure%C8%99ti&amp;navigate=yes" target="_blank" rel="noopener">
      <span>Waze</span>
      <span class="go"><small>Pornește navigarea</small><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M7 17 17 7M9 7h8v8"/></svg></span>
    </a>
    <a class="btn" href="https://maps.apple.com/?address=Bulevardul%20Aviatorilor%2052%2C%20Sector%201%2C%20Bucure%C8%99ti" target="_blank" rel="noopener">
      <span>Apple Maps</span>
      <span class="go"><small>Pentru iPhone</small><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M7 17 17 7M9 7h8v8"/></svg></span>
    </a>
  </section>
</main>
<script>
(function () {
  var btn = document.getElementById('copy-address');
  var label = document.getElementById('copy-label');
  var text = 'Bulevardul Aviatorilor nr. 52, etaj 1, Sector 1, București';
  btn.addEventListener('click', function () {
    function done(msg) {
      label.textContent = msg;
      btn.setAttribute('data-done', 'true');
      setTimeout(function () { label.textContent = 'Copiază adresa'; btn.setAttribute('data-done', 'false'); }, 2200);
    }
    try {
      navigator.clipboard.writeText(text).then(function () { done('Adresa a fost copiată'); }, function () { done('Copierea nu este disponibilă'); });
    } catch (e) { done('Copierea nu este disponibilă'); }
  });
})();
</script>
</body>
</html>
